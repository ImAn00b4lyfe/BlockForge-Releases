name: Dump vanilla data names
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: List vanilla 1.21.1 placed features, biomes and loot
        run: |
          set -e
          M=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          U=$(echo "$M" | python3 -c "import sys,json;print([v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='1.21.1'][0])")
          S=$(curl -s "$U" | python3 -c "import sys,json;print(json.load(sys.stdin)['downloads']['server']['url'])")
          curl -sL "$S" -o server.jar
          mkdir x && cd x && unzip -q ../server.jar
          INNER=$(ls META-INF/versions/*/server-*.jar | head -1)
          mkdir y && cd y && unzip -q ../$INNER && cd ..
          for d in worldgen/placed_feature worldgen/biome loot_table/blocks loot_table/entities; do
            n=$(echo $d | tr '/' '_')
            ls y/data/minecraft/$d | sed 's/.json//' | tr '\n' ' ' > /tmp/$n.txt
            python3 - "$n" <<'PY'
          import sys
          n=sys.argv[1]; w=open('/tmp/%s.txt'%n).read().split()
          chunk=[];size=0;k=0
          for x in w:
              if size+len(x)+1>3000:
                  print('::notice title=%s_%d::%s'%(n,k,' '.join(chunk))); chunk=[];size=0;k+=1
              chunk.append(x);size+=len(x)+1
          print('::notice title=%s_%d::%s'%(n,k,' '.join(chunk)))
          PY
          done
